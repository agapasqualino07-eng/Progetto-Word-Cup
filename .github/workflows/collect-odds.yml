# Raccoglie le quote REALI del Mondiale (apertura/chiusura) + risultati, e le
# salva nel repo: settimana dopo settimana si costruisce data/history.csv, il
# dataset per il backtest ROI/CLV. Tutto dati reali raccolti mentre accadono.
#
# Richiede il Secret ODDS_API_KEY. Gira ogni 8 ore (≈180 richieste/mese, entro
# il free tier). Avvio manuale anche dal tab Actions.
name: Raccolta quote storiche

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # serve per ricommittare i dati raccolti

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Snapshot quote + costruzione storico
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.data.odds_history all
      - name: Committa i dati raccolti (se cambiati)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds_snapshots.csv data/history.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessun nuovo dato da salvare."
          else
            git commit -m "Dati: aggiornamento quote/risultati reali (automatico)"
            git push
          fi
